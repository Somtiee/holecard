[package]
name = "holecard-replay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Replays a Holecard tournament from its committed seed, VRF output and action log; run by OutLayer before the arena contract pays prizes."

[[bin]]
name = "holecard-replay"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
